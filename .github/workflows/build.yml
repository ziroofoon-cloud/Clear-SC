name: build
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ClearOverlay.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already ships an Android SDK; only accept licenses and make sure
      # platform 34 / build-tools 34.0.0 exist. (android-actions/setup-android is not
      # needed and currently fails with "Failed to find package 'tools'".)
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: ClearOverlay

      - uses: actions/upload-artifact@v4
        with:
          name: ClearOverlay-apk
          path: ClearOverlay/app/build/outputs/apk/debug/*.apk
